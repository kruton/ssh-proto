name: SonarCloud
on:
  workflow_run:
    workflows: [Continuous Integration]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  sonar:
    uses: connectbot/actions/.github/workflows/sonar-analysis.yml@465af86d6d58b2845c990ea68f2d7a102907cba7
    with:
      producer_workflow: .github/workflows/ci.yml
      artifact_prefix: sonar-inputs
      config_path: .github/sonar.json
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
